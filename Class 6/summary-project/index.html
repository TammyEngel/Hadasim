<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatGPT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <header class="top-header">

        <nav class="top-nav">

            <!-- LEFT -->

            <div class="brand">

                <a href="index.html" class="brand-link">

                    <img
                        src="images/Screenshot 2026-10-11 at 12.01.01.png"
                        alt="ChatGPT logo"
                        class="brand-logo"
                    >

                    <span class="brand-name">
                        ChatGPT
                    </span>

                    <span class="arrow">
                        ▾
                    </span>

                </a>

            </div>


            <!-- CENTER -->

            <div class="nav-links">

                <a href="#">About</a>
                <a href="#">Features</a>
                <a href="#">Learn</a>
                <a href="#">Business</a>
                <a href="#">Pricing</a>

                <a href="images.html">
                    Images
                </a>

                <a href="agent.html">
                    Agent
                </a>

                <a href="#">
                    Download
                </a>

            </div>


            <!-- RIGHT -->

            <div class="nav-actions">

                <a href="#" class="login-button">
                    Log in
                </a>

                <a href="#" class="signup-button">
                    Sign up for free
                </a>

                <a href="#" class="help-button">
                    ?
                </a>

            </div>

        </nav>

    </header>


    <main>

        <section class="hero">

            <h1>
                What’s on the agenda today?
            </h1>


            <form class="prompt-box">

                <label for="prompt" class="hidden-label">
                    Ask anything
                </label>

                <input
                    type="text"
                    id="prompt"
                    name="prompt"
                    placeholder="Ask anything"
                >


                <div class="prompt-actions">

                    <button type="button">
                        📎 Attach
                    </button>

                    <button type="button">
                        ◉ Search
                    </button>

                    <button type="button">
                        ◫ Study
                    </button>

                    <a href="images.html" class="action-button">
                        ▧ Create image
                    </a>

                </div>


                <button type="button" class="voice-button">
                    ♪ Voice
                </button>

            </form>

        </section>

    </main>

</body>

</html>
